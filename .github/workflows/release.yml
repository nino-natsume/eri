name: Release

# push 到 main (或 v* tag / 手动触发): 构建 Windows 独立面板 exe, 重建 Release `latest`（刷新发布日期, 仓库页显示为最新）并更新资产, 同时把 `latest` tag 移动到本次提交
# GitHub Release 发布: 把 exe (含校验和) 附加到该 Release
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Windows 面板 exe
    # bun 的 --windows-icon/--windows-hide-console 仅在 Windows 宿主可用 (--target 跨编译也不行), 故用 windows 原生构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 构造派生资源（派生文件不入库：icon.ico 由 logo.png 生成、dll.js 由 libwebview.dll 生成）
        shell: bash
        run: |
          set -euo pipefail
          node ui/make-icon.js
          node ui/native/gen-dll.js

      - name: 编译独立 exe (bun --compile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build ./ui/panel.js ./ui/worker.js --compile --windows-icon=ui/icon.ico --windows-hide-console --outfile dist/eri-panel.exe

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum eri-panel.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eri-panel-windows-x64
          path: |
            dist/eri-panel.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  attach-release:
    name: 产物放入 Release
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 移动 latest tag 到本次提交
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/latest" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "==> latest -> $GITHUB_SHA"

      - name: 更新 Release（push 时重建刷新日期）
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          if ! test -f dist/eri-panel.exe; then
            echo "::error::未找到 dist/eri-panel.exe（artifact 结构异常）"
            ls -lR dist
            exit 1
          fi
          if [ "$EVENT" = "release" ]; then
            TAG="$REL_TAG"
          else
            TAG="latest"
            gh release delete "$TAG" -R "$REPO" --yes >/dev/null 2>&1 || true
            if ! gh release create "$TAG" -R "$REPO" --title "绘里酱" --notes "**eri-panel.exe** — 绘里酱管理面板（独立单文件, 无需 Bun, 打开即用）；SHA256SUMS.txt 为校验和。本 Release 由 CI 在每次推送时自动重建更新, 构建自 main @ ${GITHUB_SHA::7}"; then
              echo "::error::gh release create 失败"
              exit 1
            fi
          fi
          if ! gh release upload "$TAG" -R "$REPO" dist/eri-panel.exe dist/SHA256SUMS.txt --clobber; then
            echo "::error::gh release upload 失败"
            exit 1
          fi
          echo "==> Release [$TAG] 资产已更新"

  summary:
    name: 汇总
    needs: [windows-exe, attach-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 写入 Step Summary
        run: |
          {
            echo "### Release build"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- Windows exe: ${{ needs.windows-exe.result }}"
            echo "- Release 资产: ${{ needs.attach-release.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

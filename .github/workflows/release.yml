name: Release

# push 到 main (或 v* tag / 手动触发): 构建 npm 包 + Windows 独立面板 exe, 上传为 artifact
# GitHub Release 发布: 把 tgz / exe 附加到 Release, 并在配置了 NPM_TOKEN 时发布到 npm
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: '同时发布到 npm (需仓库配置 NPM_TOKEN)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  npm-package:
    name: npm 包 (tgz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          T="${GITHUB_REF#refs/tags/v}"
          if [ "$V" != "$T" ]; then
            echo "::error::tag v$T 与 package.json 版本 $V 不一致"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建 npm 包
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: eri-ai-npm-tarball
          path: dist/*.tgz
          if-no-files-found: error

  windows-exe:
    name: Windows 面板 exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 构造派生资源 (派生文件不入库: icon.ico 由 logo.png 生成, dll.js 由 libwebview.dll 生成)
        run: |
          set -euo pipefail
          node ui/make-icon.js
          node ui/native/gen-dll.js

      - name: 编译独立 exe (bun --compile)
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build ./ui/panel.js ./ui/worker.js --compile --target=bun-windows-x64 --windows-icon=ui/icon.ico --windows-hide-console --outfile dist/eri-panel.exe

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          sha256sum eri-panel.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eri-panel-windows-x64
          path: |
            dist/eri-panel.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-npm:
    name: 发布到 npm
    needs: npm-package
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Release tag 与 package.json 版本一致
        if: github.event_name == 'release'
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          if [ "${REL_TAG#v}" != "$V" ]; then
            echo "::error::Release tag $REL_TAG 与 package.json 版本 $V 不一致"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: npm publish
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: 未配置 NPM_TOKEN, 跳过发布
        if: env.NPM_TOKEN == ''
        run: echo "::warning::未配置 NPM_TOKEN, 已跳过 npm publish"

  attach-release:
    name: 附加到 GitHub Release
    needs: [npm-package, windows-exe]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 上传 tgz / exe 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$REL_TAG" dist/*.tgz dist/eri-panel.exe dist/SHA256SUMS.txt --clobber

  summary:
    name: 汇总
    needs: [npm-package, windows-exe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 写入 Step Summary
        run: |
          {
            echo "### Release build"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- npm 包: ${{ needs.npm-package.result }}"
            echo "- Windows exe: ${{ needs.windows-exe.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

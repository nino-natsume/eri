name: Release

# push 到 main (或 v* tag / 手动触发): 构建 Windows 独立面板 exe, 上传为 artifact
# GitHub Release 发布: 把 exe (含校验和) 附加到 Release
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Windows 面板 exe
    # bun 的 --windows-icon/--windows-hide-console 仅在 Windows 宿主可用 (--target 跨编译也不行), 故用 windows 原生构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 构造派生资源（派生文件不入库：icon.ico 由 logo.png 生成、dll.js 由 libwebview.dll 生成）
        shell: bash
        run: |
          set -euo pipefail
          node ui/make-icon.js
          node ui/native/gen-dll.js

      - name: 编译独立 exe (bun --compile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build ./ui/panel.js ./ui/worker.js --compile --windows-icon=ui/icon.ico --windows-hide-console --outfile dist/eri-panel.exe

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum eri-panel.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eri-panel-windows-x64
          path: |
            dist/eri-panel.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  attach-release:
    name: 附加到 GitHub Release
    needs: windows-exe
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 上传 exe 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$REL_TAG" dist/eri-panel.exe dist/SHA256SUMS.txt --clobber

  summary:
    name: 汇总
    needs: [windows-exe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 写入 Step Summary
        run: |
          {
            echo "### Release build"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- Windows exe: ${{ needs.windows-exe.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

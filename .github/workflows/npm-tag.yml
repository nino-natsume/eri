name: Sync tags

# git tag 跟随版本更新:
#   - push 到 main (产生新 commit): 读取代码内 package.json 的版本, 补建对应的
#     vX.Y.Z tag, 并把移动标签 `latest` 指向这次的最新提交
#   - 每天轮询 npm registry: 发现新版本就补建对应的 vX.Y.Z tag
#   - GitHub Release 发布时: 确保版本 tag 存在
#   - 始终保持一个移动的 `latest` tag, 默认代表最新
on:
  push:
    branches: [main]          # 每产生一个新 commit 就更新 tag
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * *'       # 每天 03:00 UTC 检查 npm
  workflow_dispatch:
    inputs:
      version:
        description: '要打 tag 的版本 (如 1.1.3); 留空则取 npm registry 的 latest'
        required: false

permissions:
  contents: write

concurrency:
  group: npm-tag-sync
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve target version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          INPUT_VER: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          RAW=""
          if [ "$EVENT" = "release" ] && [ -n "${REL_TAG:-}" ]; then
            RAW="$REL_TAG"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "${INPUT_VER:-}" ]; then
            RAW="$INPUT_VER"
          elif [ "$EVENT" = "push" ]; then
            # 新 commit: 版本号直接来自代码里的 package.json
            RAW="$(node -p "require('./package.json').version")"
          else
            # 轮询 npm registry 的 latest 版本
            RAW="$(npm view eri-ai version --silent 2>/dev/null || true)"
          fi
          if [ -z "$RAW" ]; then
            echo "::error::无法确定目标版本"
            exit 1
          fi
          V="${RAW#v}"                 # 去掉可能的 v 前缀
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::版本号格式非法: $RAW"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"     >> "$GITHUB_OUTPUT"
          echo "==> 目标版本: v$V (event=$EVENT)"

      - name: Ensure version tag exists
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "==> 本地已存在 $TAG, 跳过创建"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "==> 远端已存在 $TAG, 拉取到本地"
            git fetch --tags --force --quiet
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            echo "==> 已创建并推送 $TAG -> $(git rev-list -n1 "$TAG" | cut -c1-12)"
          fi

      - name: Update `latest`
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          if [ "$EVENT" = "push" ]; then
            # 产生新 commit: latest 直接指向这次的最新提交
            TARGET="$(git rev-parse HEAD)"
            REASON="新 commit"
          else
            # npm / release / 手动: latest 指向仓库内最高版本 tag
            HIGHEST="$(git tag --list 'v*' \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' \
              | sort -V \
              | tail -n1)"
            echo "==> 仓库内最高版本: v$HIGHEST / 目标版本: v$VERSION"
            if [ "$VERSION" != "$HIGHEST" ]; then
              echo "==> 目标不是最高版本, 保持 latest 不变"
              exit 0
            fi
            TARGET="$(git rev-list -n1 "$TAG")"
            REASON="最新版本 v$VERSION"
          fi
          git tag -f latest "$TARGET"
          git push -f origin refs/tags/latest
          echo "==> 已更新 latest -> $TARGET ($REASON)"

      - name: Summary
        run: |
          {
            echo "### Tag sync"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- version tag: \`${{ steps.resolve.outputs.tag }}\`"
            echo "- latest -> \`$(git rev-list -n1 latest 2>/dev/null | cut -c1-12 || echo none)\`"
          } >> "$GITHUB_STEP_SUMMARY"
